# Example only. Do not put real secrets in this file.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: staging
      NODE_ENV: production
      API_PORT: "3001"
      APP_URL: https://staging.example.invalid
      CORS_ORIGIN: https://staging.example.invalid
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_FEATURES_ENABLED: "false"
      AI_PROVIDER: disabled
      LOG_LEVEL: info
      LOG_REQUESTS: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api-staging.example.invalid
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prij_clinic_staging
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d prij_clinic_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  staging_postgres_data:
