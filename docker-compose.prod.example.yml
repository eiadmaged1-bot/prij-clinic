# Example only. V0.1 is not approved for real production.
# Use a managed database, secret manager, HTTPS ingress, encrypted backups, monitoring, and legal/privacy review.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      NODE_ENV: production
      API_PORT: "3001"
      APP_URL: https://clinic.example.invalid
      CORS_ORIGIN: https://clinic.example.invalid
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_FEATURES_ENABLED: "false"
      AI_PROVIDER: disabled
      LOG_LEVEL: info
      LOG_REQUESTS: "false"
      UPLOAD_STORAGE_ROOT: /secure/prij-clinic/uploads
      BACKUP_ROOT: /secure/prij-clinic/backups
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.clinic.example.invalid
    ports:
      - "3000:3000"
