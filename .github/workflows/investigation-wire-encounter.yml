name: Investigation Typecheck Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'work/doctor-investigation-station-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/doctor-investigation-station-v1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > investigation-typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat investigation-typecheck.log
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigation-typecheck-diagnostics
          path: investigation-typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Preserve typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
