name: Finalize Investigation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/doctor-investigation-station-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/doctor-investigation-station-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source corrections
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pagePath = 'apps/web/app/investigations/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace('const [status, setStatus] = useState(t.ready);', 'const [status, setStatus] = useState<string>(t.ready);');
          page = page.replace(
`function authHeaders() {
  const token = sessionStorage.getItem("prijClinicToken");
  return token ? { authorization: \`Bearer \${token}\` } : {};
}

function csrfHeaders() {
  const token = /(?:^|;\\s*)csrf-token=([^;]+)/.exec(document.cookie)?.[1];
  return token ? { "x-csrf-token": decodeURIComponent(token) } : {};
}`,
`function authHeaders(): Record<string, string> {
  const token = sessionStorage.getItem("prijClinicToken");
  return token ? { authorization: \`Bearer \${token}\` } : {};
}

function csrfHeaders(): Record<string, string> {
  const token = /(?:^|;\\s*)csrf-token=([^;]+)/.exec(document.cookie)?.[1];
  return token ? { "x-csrf-token": decodeURIComponent(token) } : {};
}`);
          if (!page.includes('useState<string>(t.ready)')) throw new Error('Status-state correction did not apply');
          if (!page.includes('function authHeaders(): Record<string, string>')) throw new Error('Header correction did not apply');
          fs.writeFileSync(pagePath, page);

          const visitPath = 'apps/web/components/clinic/ActiveVisitWorkspace.tsx';
          let visit = fs.readFileSync(visitPath, 'utf8');
          const importNeedle = 'import { PatientVisitIdentityBar } from "./PatientVisitIdentityBar";';
          if (!visit.includes('EncounterInvestigationOrderBuilder')) {
            if (!visit.includes(importNeedle)) throw new Error('PatientVisitIdentityBar import not found');
            visit = visit.replace(importNeedle, `${importNeedle}\nimport { EncounterInvestigationOrderBuilder } from "@/components/investigations/EncounterInvestigationOrderBuilder";`);
          }
          const renderNeedle = '{activeModule === "investigations" ? <InvestigationsModule patientId={patientId} visitId={visitId} /> : null}';
          const renderReplacement = '{activeModule === "investigations" ? <EncounterInvestigationOrderBuilder patientId={patientId} encounterId={visitId} patientName={String(patient?.name ?? "Patient")} onSaved={() => void loadVisit()} /> : null}';
          if (visit.includes(renderNeedle)) visit = visit.replace(renderNeedle, renderReplacement);
          visit = visit.replace(/function InvestigationsModule\([\s\S]*?\n}\n\nfunction UltrasoundModule/, 'function UltrasoundModule');
          if (!visit.includes(renderReplacement)) throw new Error('Embedded investigation builder was not wired');
          if (visit.includes('Open connected investigation ordering')) throw new Error('Legacy investigation handoff remains');
          fs.writeFileSync(visitPath, visit);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/investigation-wire-encounter.yml
          git add apps/web/app/investigations/page.tsx apps/web/components/clinic/ActiveVisitWorkspace.tsx
          git commit -m "feat(investigations): finalize direct and embedded ordering workflow"
          git push origin HEAD:work/doctor-investigation-station-v1
