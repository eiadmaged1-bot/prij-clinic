name: Diagnose Sprint 1 Arabic RTL Regressions

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_ARABIC_RTL_OPERATIONS_TRIGGER.md

permissions:
  contents: read

concurrency:
  group: diagnose-sprint1-arabic-rtl-regressions
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 1
          path: controls

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: work/arabic-rtl-operations-v1
          fetch-depth: 1
          path: workspace

      - name: Capture prepared apply and focused regression output
        id: diagnose
        working-directory: workspace
        shell: bash
        run: |
          set +e
          {
            node ../controls/scripts/runner/prepare-arabic-rtl-controller.mjs ../controls
            prepare_status=$?
            echo "PREPARE_EXIT=$prepare_status"
            if [[ $prepare_status -eq 0 ]]; then
              node ../controls/scripts/runner/run-sprint1-arabic-rtl-operations.mjs "$PWD"
              apply_status=$?
            else
              apply_status=$prepare_status
            fi
            echo "APPLY_EXIT=$apply_status"
            if [[ $apply_status -eq 0 ]]; then
              node scripts/sprint1-arabic-rtl-operations-test.mjs
              contract_status=$?
              echo "ARABIC_CONTRACT_EXIT=$contract_status"
            else
              contract_status=$apply_status
            fi
            if [[ $contract_status -eq 0 ]]; then
              node scripts/sprint1-offline-sync-health-test.mjs
              offline_status=$?
              echo "OFFLINE_REGRESSION_EXIT=$offline_status"
            else
              offline_status=$contract_status
            fi
          } > arabic-rtl-regression-diagnostic.log 2>&1
          cat arabic-rtl-regression-diagnostic.log
          echo "exit_code=${offline_status:-1}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: arabic-rtl-regression-diagnostic
          path: workspace/arabic-rtl-regression-diagnostic.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failure conclusion
        if: steps.diagnose.outputs.exit_code != '0'
        run: exit 1
