name: Diagnose Sprint 1 Reception Queue Apply

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_RECEPTION_QUEUE_TRIGGER.md

permissions:
  contents: read

concurrency:
  group: diagnose-sprint1-reception-queue-apply
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 1
          path: controls

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: work/sprint1-reception-queue-core-v1
          fetch-depth: 1
          path: workspace

      - name: Capture deterministic apply and v148 output
        id: diagnose
        working-directory: workspace
        shell: bash
        run: |
          set +e
          {
            node ../controls/scripts/runner/run-sprint1-reception-queue-core.mjs "$PWD"
            apply_status=$?
            echo "APPLY_EXIT=$apply_status"
            if [[ $apply_status -eq 0 ]]; then
              node ../controls/scripts/runner/apply-sprint1-reception-queue-test-fix.mjs "$PWD"
              test_fix_status=$?
              echo "TEST_FIX_EXIT=$test_fix_status"
              node scripts/v148-reception-patient-queue-test.mjs
              v148_status=$?
              echo "V148_EXIT=$v148_status"
            else
              v148_status=$apply_status
            fi
          } > reception-queue-diagnostic.log 2>&1
          cat reception-queue-diagnostic.log
          echo "exit_code=${v148_status:-1}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: reception-queue-v148-diagnostic
          path: workspace/reception-queue-diagnostic.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failure conclusion
        if: steps.diagnose.outputs.exit_code != '0'
        run: exit 1
