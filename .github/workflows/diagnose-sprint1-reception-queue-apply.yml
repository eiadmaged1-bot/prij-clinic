name: Diagnose Sprint 1 Reception Queue Apply

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_RECEPTION_QUEUE_TRIGGER.md

permissions:
  contents: read

concurrency:
  group: diagnose-sprint1-reception-queue-apply
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 1
          path: controls

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: work/sprint1-reception-queue-core-v1
          fetch-depth: 1
          path: workspace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Apply deterministic package
        working-directory: workspace
        run: |
          node ../controls/scripts/runner/run-sprint1-reception-queue-core.mjs "$PWD"
          node ../controls/scripts/runner/apply-sprint1-reception-queue-test-fix.mjs "$PWD"

      - name: Install dependencies
        working-directory: workspace
        run: npm ci

      - name: Generate Prisma client
        working-directory: workspace
        run: npm run prisma:generate

      - name: Capture production-build output
        id: diagnose
        working-directory: workspace
        shell: bash
        run: |
          set +e
          npm run build > reception-queue-diagnostic.log 2>&1
          build_status=$?
          cat reception-queue-diagnostic.log
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: reception-queue-build-diagnostic
          path: workspace/reception-queue-diagnostic.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failure conclusion
        if: steps.diagnose.outputs.exit_code != '0'
        run: exit 1
