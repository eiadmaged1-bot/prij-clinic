name: Prij Sprint 1 QA Pregnancy and EDD

on:
  workflow_dispatch:
  push:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - .github/workflows/prij-sprint1-qa-pregnancy-edd.yml

permissions:
  contents: write

concurrency:
  group: prij-sprint1-qa-pregnancy-edd
  cancel-in-progress: false

jobs:
  implement-repair-verify:
    name: Implement pregnancy context guard and EDD provenance
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      PRIJ_QA_LOG_DIR: ${{ github.workspace }}/qa-preg-edd-logs-${{ github.run_id }}

    steps:
      - id: prepare
        name: Prepare isolated SECTRA workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SECTRA') { throw "Expected SECTRA, got '$env:RUNNER_NAME'." }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows, got '$env:RUNNER_OS'." }
          foreach ($name in @('qa-preg-edd-workspace', 'qa-preg-edd-failure')) {
            $target = Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          if (Test-Path -LiteralPath $env:PRIJ_QA_LOG_DIR) { Remove-Item -LiteralPath $env:PRIJ_QA_LOG_DIR -Recurse -Force }
          New-Item -ItemType Directory -Force $env:PRIJ_QA_LOG_DIR | Out-Null

      - name: Checkout QA repair branch
        uses: actions/checkout@v4
        with:
          ref: work/sprint1-qa-repair-batch
          fetch-depth: 0
          clean: true
          path: qa-preg-edd-workspace

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-preg-edd-workspace/package-lock.json

      - id: guard
        name: Verify branch, contract, and Codex
        working-directory: qa-preg-edd-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current).Trim() -ne 'work/sprint1-qa-repair-batch') { throw 'Wrong QA branch checked out.' }
          if (git status --porcelain) { throw 'QA branch checkout is not clean.' }
          foreach ($path in @('scripts/qa-pregnancy-edd-contract-test.mjs', 'docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing locked QA contract: $path" }
          }
          codex --version
          if ($LASTEXITCODE -ne 0) { throw 'Codex CLI is unavailable on SECTRA.' }
          $contractHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'scripts/qa-pregnancy-edd-contract-test.mjs').Hash
          $specHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md').Hash
          "PRIJ_QA_CONTRACT_HASH=$contractHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRIJ_QA_SPEC_HASH=$specHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -LiteralPath (Join-Path (git rev-parse --git-dir).Trim() 'info/exclude') -Value "`nlocal-reference/`n"

      - id: env
        name: Load local development configuration safely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $envPath = 'C:\Newfolder\prij-clinic\.env'
          if (-not (Test-Path -LiteralPath $envPath)) { throw "Missing local environment file: $envPath" }
          $allowed = @('DATABASE_URL', 'JWT_SECRET', 'JWT_EXPIRES_IN', 'AI_FEATURES_ENABLED', 'AI_PROVIDER')
          $databaseFound = $false
          foreach ($line in Get-Content -LiteralPath $envPath) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#') -or -not $trimmed.Contains('=')) { continue }
            $parts = $trimmed.Split('=', 2)
            $key = $parts[0].Trim()
            if ($allowed -notcontains $key) { continue }
            $value = $parts[1].Trim().Trim('"').Trim("'")
            if ($key -eq 'DATABASE_URL' -and $value) { $databaseFound = $true }
            "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (-not $databaseFound) { throw 'DATABASE_URL was not loaded.' }
          Write-Host 'Local environment loaded without printing secret values.'

      - id: install
        name: Install dependencies and prepare regression prerequisites
        working-directory: qa-preg-edd-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run prisma:generate
          if ($LASTEXITCODE -ne 0) { throw 'Prisma Client generation failed.' }

          $referenceSource = 'C:\Newfolder\prij-clinic\local-reference\egyptian-drugs'
          $referenceTarget = 'local-reference\egyptian-drugs'
          $referenceFile = Join-Path $referenceSource 'egyptian-drugs.csv'
          if (-not (Test-Path -LiteralPath $referenceFile)) { throw "Missing local medication reference: $referenceFile" }
          New-Item -ItemType Directory -Force $referenceTarget | Out-Null
          Copy-Item -Path (Join-Path $referenceSource '*') -Destination $referenceTarget -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $referenceTarget 'egyptian-drugs.csv'))) { throw 'Medication reference copy failed.' }

          npm run build --workspace @prij-clinic/api
          if ($LASTEXITCODE -ne 0) { throw 'API prebuild for search verification failed.' }

      - id: implement
        name: Implement the two locked P0 QA tickets
        working-directory: qa-preg-edd-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $promptPath = Join-Path $env:PRIJ_QA_LOG_DIR 'implementation.prompt.txt'
          $stdoutPath = Join-Path $env:PRIJ_QA_LOG_DIR 'implementation.stdout.log'
          $stderrPath = Join-Path $env:PRIJ_QA_LOG_DIR 'implementation.stderr.log'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $prompt = @'
Inspect the real Prij Clinic codebase before editing. Implement only QA-PREG-001 and QA-EDD-001 on the checked-out work/sprint1-qa-repair-batch branch.

Locked contract files already exist and MUST NOT be edited:
- scripts/qa-pregnancy-edd-contract-test.mjs
- docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md

Required implementation:
1. Create packages/shared/src/pregnancy-dating.ts and export it through packages/shared/src/index.ts.
2. Implement the exact public functions required by the locked contract: calculateEddCandidate, confirmEddCandidate, and isPregnancyMenstrualUiSuppressed.
3. Use strict ISO date-only UTC arithmetic. LMP +280 days; known conception +266 days; day-5 embryo transfer +261 days; day-3 transfer +263 days; ultrasound from explicit scan EDD or scan date plus the remaining days to 280 from explicit gestational weeks and days. Do not infer from free text.
4. A calculated date is only a candidate preview. Never silently overwrite a confirmed EDD. A different confirmed EDD requires explicit replacement and a correction reason. Preserve mode, source, source date, confirmation date, clinician, correction reason, previous EDD, and datingHistory.
5. Update ActiveVisitWorkspace reproductive history UI. During active pregnancy, ordinary current-cycle menstrual fields and ordinary menstrual abnormality flags must be suppressed. Preserve and clearly display a read-only pre-pregnancy menstrual baseline. Add pregnancy-specific bleeding fields pregnancyBleedingStatus and pregnancyBleedingOnsetDate. Do not erase historical LMP or prior cycle data.
6. Add manual and calculated EDD modes with source-specific structured fields for LMP, ultrasound, IVF embryo transfer, and known conception. Show a Calculation preview with the explicit text that clinician confirmation is required. Add a Confirm authoritative EDD action. Replacing a different confirmed EDD must require an explicit replacement choice and correction reason.
7. Keep signed snapshots immutable and keep existing encounter JSON persistence/provenance. Do not add a migration.
8. Update Patient Overview only where necessary so active pregnancy does not render ordinary current-cycle activity as active menstruation. Preserve historical menstrual timeline data.
9. Do not implement automatic ultrasound redating thresholds, diagnosis, treatment advice, calendar compaction, medication redesign, or prescription redesign in this package.
10. Keep UI compact and compatible with existing styling. Add narrowly scoped CSS only when necessary.

Safety rules:
- No migration, seed, database reset, delete, truncate, production-data access, reference-data edits, secrets, PHI, or external network calls.
- Do not weaken, skip, delete, bypass, or modify the locked contract test.
- Do not stage, commit, push, reset, clean, stash, or switch branches.
- Keep changes limited to apps/web and packages/shared.
- Preserve Feature 46 behavior and all signed historical records.

Finish with a concise summary of changed files. The outer workflow runs and repairs all tests.
'@
          [System.IO.File]::WriteAllText($promptPath, $prompt, $utf8NoBom)
          $process = Start-Process -FilePath 'codex.exe' -ArgumentList @('-a', 'never', '-s', 'workspace-write', 'exec', '--ephemeral') -NoNewWindow -Wait -PassThru -RedirectStandardInput $promptPath -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ } }
          if ($process.ExitCode -ne 0) { throw "Codex implementation exited with code $($process.ExitCode)." }

      - id: verify
        name: Repair until all contract and regression checks pass
        working-directory: qa-preg-edd-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-LockedContracts {
            $contractHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'scripts/qa-pregnancy-edd-contract-test.mjs').Hash
            $specHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md').Hash
            if ($contractHash -ne $env:PRIJ_QA_CONTRACT_HASH) { throw 'Locked pregnancy/EDD contract test was modified.' }
            if ($specHash -ne $env:PRIJ_QA_SPEC_HASH) { throw 'Locked pregnancy/EDD implementation specification was modified.' }
          }

          function Invoke-Check([string]$Name, [string]$Command) {
            $stdout = Join-Path $env:PRIJ_QA_LOG_DIR "$Name.stdout.log"
            $stderr = Join-Path $env:PRIJ_QA_LOG_DIR "$Name.stderr.log"
            $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d', '/s', '/c', $Command) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | ForEach-Object { Write-Host $_ } }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | ForEach-Object { Write-Host $_ } }
            return [int]$process.ExitCode
          }

          function Invoke-CodexRepair([string]$Prompt, [string]$LogName) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            $promptPath = Join-Path $env:PRIJ_QA_LOG_DIR "$LogName.prompt.txt"
            $stdoutPath = Join-Path $env:PRIJ_QA_LOG_DIR "$LogName.stdout.log"
            $stderrPath = Join-Path $env:PRIJ_QA_LOG_DIR "$LogName.stderr.log"
            [System.IO.File]::WriteAllText($promptPath, $Prompt, $utf8NoBom)
            $process = Start-Process -FilePath 'codex.exe' -ArgumentList @('-a', 'never', '-s', 'workspace-write', 'exec', '--ephemeral') -NoNewWindow -Wait -PassThru -RedirectStandardInput $promptPath -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath | ForEach-Object { Write-Host $_ } }
            if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ } }
            return [int]$process.ExitCode
          }

          $passed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Assert-LockedContracts
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'Implementation has diff-check errors.' }

            $results = [ordered]@{}
            $results['qa-pregnancy-edd'] = Invoke-Check 'qa-pregnancy-edd' 'node scripts/qa-pregnancy-edd-contract-test.mjs'
            $results['feature46'] = Invoke-Check 'feature46' 'node scripts/feature-46-refractory-complaint-test.mjs'
            $results['clinical-workflow'] = Invoke-Check 'clinical-workflow' 'node scripts/clinical-workflow-unification-test.mjs'
            $results['fix3-medication'] = Invoke-Check 'fix3-medication' 'node scripts/recovery-fix3-medication-test.mjs'
            $results['fix3-search'] = Invoke-Check 'fix3-search' 'node scripts/recovery-fix3-search-test.mjs'
            $results['typecheck'] = Invoke-Check 'typecheck' 'npm run typecheck'
            $results['build'] = Invoke-Check 'build' 'npm run build'
            $failed = @($results.GetEnumerator() | Where-Object { [int]$_.Value -ne 0 })
            if ($failed.Count -eq 0) { $passed = $true; break }
            if ($attempt -eq 5) { break }

            $failureSummary = foreach ($entry in $failed) {
              $stdout = Join-Path $env:PRIJ_QA_LOG_DIR "$($entry.Key).stdout.log"
              $stderr = Join-Path $env:PRIJ_QA_LOG_DIR "$($entry.Key).stderr.log"
              $tail = @()
              if (Test-Path -LiteralPath $stdout) { $tail += @(Get-Content -LiteralPath $stdout -Tail 120) }
              if (Test-Path -LiteralPath $stderr) { $tail += @(Get-Content -LiteralPath $stderr -Tail 120) }
              "### $($entry.Key)`n$($tail -join "`n")"
            }
            $repairPrompt = @(
              'Repair the checked-out Prij Clinic QA implementation so every listed check passes.',
              '',
              'Failed checks and diagnostic tails:',
              ($failureSummary -join "`n`n"),
              '',
              'The locked files scripts/qa-pregnancy-edd-contract-test.mjs and docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md must not be edited.',
              'Preserve the pregnancy menstrual-context guard, pregnancy-specific bleeding fields, EDD candidate preview, explicit clinician confirmation, no-silent-overwrite rule, correction reason, dating history, Feature 46, and existing regression behavior.',
              'Do not weaken tests. Do not create migrations, seed/reset/delete data, edit reference/local-reference files, use the network, stage, commit, push, reset, clean, stash, or switch branches.',
              'Keep changes limited to apps/web and packages/shared. Diagnose the root cause and make the narrowest correct repair.'
            ) -join "`n"
            $repairExit = Invoke-CodexRepair $repairPrompt "repair-$attempt"
            if ($repairExit -ne 0) { Write-Host "Codex repair attempt $attempt exited $repairExit; outer loop will re-evaluate." }
          }

          Assert-LockedContracts
          if (-not $passed) { throw 'Pregnancy context and EDD package did not pass all checks after five attempts.' }

      - id: commit
        name: Commit verified QA Package 1
        working-directory: qa-preg-edd-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -eq 0) { throw 'No QA implementation changes were produced.' }
          $unsafe = @($changed | Where-Object {
            $_ -notlike 'apps/web/*' -and
            $_ -notlike 'packages/shared/*' -and
            $_ -ne 'scripts/qa-pregnancy-edd-contract-test.mjs' -and
            $_ -ne 'docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md'
          })
          if ($unsafe.Count -gt 0) { throw "Out-of-scope files changed: $($unsafe -join ', ')" }

          New-Item -ItemType Directory -Force 'docs/verification' | Out-Null
          @(
            '# QA Pregnancy Context and EDD Verification',
            '',
            '- Tickets: `QA-PREG-001`, `QA-EDD-001`',
            '- Pregnancy ordinary menstrual-cycle UI: SUPPRESSED',
            '- Pre-pregnancy menstrual baseline: PRESERVED',
            '- Pregnancy-specific bleeding fields: PASS',
            '- EDD manual mode: PASS',
            '- EDD calculated candidates (LMP, ultrasound, IVF/ET, known conception): PASS',
            '- Clinician confirmation and no-silent-overwrite guard: PASS',
            '- Correction reason and dating history: PASS',
            '- Locked contract test: PASS',
            '- Feature 46 regression: PASS',
            '- Clinical workflow regression: PASS',
            '- Medication regression: PASS',
            '- Search regression: PASS',
            '- Typecheck: PASS',
            '- Production build: PASS',
            '- Migration/seed/reset/delete/truncate: NOT RUN',
            '- Production data modified: NO'
          ) | Set-Content -LiteralPath 'docs/verification/QA_PREGNANCY_EDD_RESULT.md' -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'apps/web' 'packages/shared' 'scripts/qa-pregnancy-edd-contract-test.mjs' 'docs/verification/QA_PREGNANCY_EDD_IMPLEMENTATION_SPEC.md' 'docs/verification/QA_PREGNANCY_EDD_RESULT.md'
          $staged = @(git diff --cached --name-only)
          $unsafeStaged = @($staged | Where-Object { $_ -like 'local-reference/*' -or $_ -like 'node_modules/*' -or $_ -like '*.env' })
          if ($unsafeStaged.Count -gt 0) { throw "Unsafe files staged: $($unsafeStaged -join ', ')" }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged QA implementation has diff-check errors.' }
          git commit -m 'Implement pregnancy context guard and EDD provenance'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit verified QA Package 1.' }
          git push origin HEAD:work/sprint1-qa-repair-batch
          if ($LASTEXITCODE -ne 0) { throw 'Could not push verified QA Package 1.' }

      - name: Checkout failure-report branch
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 0
          clean: true
          path: qa-preg-edd-failure

      - name: Record exact QA Package 1 failure
        if: failure()
        working-directory: qa-preg-edd-failure
        shell: powershell
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          ENV_OUTCOME: ${{ steps.env.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          IMPLEMENT_OUTCOME: ${{ steps.implement.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'docs/verification' | Out-Null
          $lines = @(
            '# Latest QA Pregnancy and EDD Failure',
            '',
            "- Run ID: $env:GITHUB_RUN_ID",
            "- Prepare: $env:PREPARE_OUTCOME",
            "- Contract guard: $env:GUARD_OUTCOME",
            "- Environment: $env:ENV_OUTCOME",
            "- Install/prerequisites: $env:INSTALL_OUTCOME",
            "- Implementation: $env:IMPLEMENT_OUTCOME",
            "- Verification: $env:VERIFY_OUTCOME",
            "- Commit/push: $env:COMMIT_OUTCOME",
            '',
            '## Diagnostic tails'
          )
          if (Test-Path -LiteralPath $env:PRIJ_QA_LOG_DIR) {
            foreach ($file in Get-ChildItem -LiteralPath $env:PRIJ_QA_LOG_DIR -File | Sort-Object Name) {
              $lines += ''
              $lines += "### $($file.Name)"
              $lines += '```text'
              $lines += @(Get-Content -LiteralPath $file.FullName -Tail 120)
              $lines += '```'
            }
          }
          $report = 'docs/verification/LATEST_QA_PREGNANCY_EDD_FAILURE.md'
          $lines | Set-Content -LiteralPath $report -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $report
          git commit -m "ci: record QA pregnancy EDD failure $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -eq 0) { git push origin HEAD:security/rbac-scope-enforcement }

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pregnancy-edd-${{ github.run_id }}
          path: ${{ env.PRIJ_QA_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7
