name: Investigation One-Time Source Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/doctor-investigation-station-v1'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/prij_clinic_ci
      JWT_SECRET: ci-placeholder-secret
      AI_FEATURES_ENABLED: "false"
      AI_PROVIDER: disabled
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@v4
        with:
          ref: work/doctor-investigation-station-v1
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          page = Path('apps/web/app/investigations/page.tsx')
          text = page.read_text(encoding='utf-8')
          old_import = 'import { PatientPicker, patientLabel, type PatientPickerPatient } from "../../components/clinic/PatientPicker";'
          new_import = 'import { patientLabel, type PatientPickerPatient } from "../../components/clinic/PatientPicker";'
          old_catalogue = '  const catalogue = workspace.investigationCatalog ?? [];'
          new_catalogue = '  const catalogue = useMemo(() => workspace.investigationCatalog ?? [], [workspace.investigationCatalog]);'
          if old_import not in text:
              raise SystemExit('Expected PatientPicker import was not found.')
          if old_catalogue not in text:
              raise SystemExit('Expected catalogue initialization was not found.')
          page.write_text(text.replace(old_import, new_import, 1).replace(old_catalogue, new_catalogue, 1), encoding='utf-8')

          css = Path('apps/web/app/investigations/investigation-station.module.css')
          css_text = css.read_text(encoding='utf-8')
          if 'align-items:end' not in css_text:
              raise SystemExit('Expected CSS alignment value was not found.')
          css.write_text(css_text.replace('align-items:end', 'align-items:flex-end', 1), encoding='utf-8')

          Path('.github/workflows/investigation-build-diagnostic.yml').unlink(missing_ok=True)
          Path('.github/workflows/investigation-one-time-source-fix.yml').unlink(missing_ok=True)

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "prij-clinic-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/investigations/page.tsx apps/web/app/investigations/investigation-station.module.css .github/workflows/investigation-build-diagnostic.yml .github/workflows/investigation-one-time-source-fix.yml
          git commit -m "fix(investigations): pass production build gate"
          git push origin HEAD:work/doctor-investigation-station-v1
