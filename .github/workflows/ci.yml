name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/prij_clinic_ci
      JWT_SECRET: ci-placeholder-secret
      AI_FEATURES_ENABLED: "false"
      AI_PROVIDER: disabled

    steps:
      - name: Verify SECTRA runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SECTRA') {
            throw "Expected SECTRA self-hosted runner, got '$env:RUNNER_NAME'."
          }
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Expected Windows runner, got '$env:RUNNER_OS'."
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
