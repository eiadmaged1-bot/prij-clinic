name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/prij_clinic_ci
      JWT_SECRET: ci-placeholder-secret
      AI_FEATURES_ENABLED: "false"
      AI_PROVIDER: disabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate doctor workspace safety contracts
        run: |
          node scripts/dual-doctor-workspace-test.mjs
          node scripts/visit-cockpit-history-test.mjs
          node scripts/v142-core-visit-workspace-test.mjs
          node scripts/v124-clinical-safety-wording-test.mjs
