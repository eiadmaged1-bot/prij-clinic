          seed = seed.replace(
`    const data = {
      name: entry.name,`,
`    const taxonomy = canonicalTaxonomy(entry.category, entry.subcategory, entry.name, entry.modality);
    const data = {
      name: entry.name,`)
            .replace(`      category: entry.category,
      subcategory: entry.subcategory,
      clinicalGroup: entry.subcategory,`, `      category: taxonomy.category,
      subcategory: taxonomy.subcategory,
      clinicalGroup: taxonomy.subcategory,`)
            .replace(`      tagsJson: Array.from(new Set([entry.category, entry.subcategory, entry.discipline, entry.modality].filter(Boolean))),
      discipline: entry.discipline,`, `      tagsJson: Array.from(new Set([taxonomy.category, taxonomy.subcategory, entry.category, entry.subcategory, entry.discipline, entry.modality].filter(Boolean))),
      discipline: taxonomy.category,`);

          seed = seed.replace(
`  return { skipped: false, count: investigationCatalogItems.length };`,
`  const existingItems = await prisma.investigationCatalogItem.findMany({ where: { active: true } });
  for (const existing of existingItems) {
    const taxonomy = canonicalTaxonomy(existing.category, existing.subcategory, existing.name, existing.modality);
    if (taxonomy.category !== existing.category || taxonomy.subcategory !== existing.subcategory) {
      await prisma.investigationCatalogItem.update({
        where: { id: existing.id },
        data: {
          category: taxonomy.category,
          subcategory: taxonomy.subcategory,
          clinicalGroup: taxonomy.subcategory,
          discipline: taxonomy.category,
          tagsJson: Array.from(new Set([taxonomy.category, taxonomy.subcategory, existing.category, existing.subcategory].filter(Boolean)))
        }
      });
    }
  }

  return { skipped: false, count: investigationCatalogItems.length };`);

          seed = seed.replace(
`function item(code, name, category, subcategory, modality, sampleType, aliases = []) {`,
`function canonicalTaxonomy(category, subcategory, name = "", modality = "") {
  const key = `${category || ""} ${subcategory || ""} ${name || ""} ${modality || ""}`.toLowerCase();
  if (key.includes("cytology") || key.includes("histopath") || key.includes("pathology") || key.includes("pap") || key.includes("hpv")) {
    return { category: "Pathology", subcategory: key.includes("histopath") || key.includes("biopsy") || key.includes("tissue") ? "Histopathology" : key.includes("molecular") || key.includes("hpv") ? "Molecular Pathology" : "Cytology" };
  }
  if (key.includes("ultrasound") || key.includes("sonograph") || key.includes("radiology") || key.includes("imaging") || key.includes("mri") || key.includes("ct ") || key.includes("x-ray") || key.includes("xray") || key.includes("mammograph") || key.includes("fluoroscop")) {
    if (key.includes("obstetric") || key.includes("pregnancy") || key.includes("fetal") || key.includes("nuchal") || key.includes("anomaly") || key.includes("growth") || key.includes("cervical length")) return { category: "Imaging", subcategory: "Obstetric Ultrasound" };
    if (key.includes("fertility") || key.includes("infertil") || key.includes("follic")) return { category: "Imaging", subcategory: "Fertility Ultrasound" };
    if (key.includes("gynec") || key.includes("pelvic ultrasound") || key.includes("transvaginal") || key.includes("uterine") || key.includes("sonohyst")) return { category: "Imaging", subcategory: "Gynecologic Ultrasound" };
    if (key.includes("breast") || key.includes("mammograph")) return { category: "Imaging", subcategory: "Breast Imaging" };
    if (key.includes("mri")) return { category: "Imaging", subcategory: "MRI" };
    if (key.includes("ct ") || key.includes("computed")) return { category: "Imaging", subcategory: "CT" };
    if (key.includes("x-ray") || key.includes("xray") || key.includes("fluoroscop") || key.includes("hsg")) return { category: "Imaging", subcategory: "X-ray and Fluoroscopy" };
    return { category: "Imaging", subcategory: subcategory || "General Imaging" };
  }
  if (key.includes("cardiac") || key.includes("cardio") || key.includes("ecg") || key.includes("echo")) return { category: "Cardiac and Functional Tests", subcategory: subcategory || "Cardiac Testing" };
  if (key.includes("referral") || key.includes("specialist") || key.includes("assessment") || key.includes("preoperative") || key.includes("anaesth") || key.includes("anesth")) return { category: "Procedures and Referrals", subcategory: subcategory || "Specialist Assessment" };
  if (key.includes("microbiology") || key.includes("culture") || key.includes("swab") || key.includes("naat") || key.includes("pcr")) return { category: "Laboratory", subcategory: "Microbiology" };
  if (key.includes("prenatal") || key.includes("nipt") || key.includes("karyotype") || key.includes("genetic") || key.includes("quad screen")) return { category: "Laboratory", subcategory: "Genetics and Prenatal Screening" };
  if (key.includes("serology") || key.includes("infectious") || key.includes("antenatal screening") || key.includes("immunology") || key.includes("antibody") || key.includes("hiv") || key.includes("hbsag") || key.includes("hcv") || key.includes("rubella") || key.includes("toxoplas") || key.includes("cmv") || key.includes("vdrl") || key.includes("rpr")) return { category: "Laboratory", subcategory: "Serology and Immunology" };
  if (key.includes("coag") || key.includes("inr") || key.includes("aptt") || key.includes("fibrin") || key.includes("d-dimer")) return { category: "Laboratory", subcategory: "Coagulation" };
  if (key.includes("hormone") || key.includes("endocr") || key.includes("tsh") || key.includes("prolact") || key.includes("amh") || key.includes("testosterone") || key.includes("estradiol") || key.includes("progesterone") || key.includes("fsh") || key.includes("lh")) return { category: "Laboratory", subcategory: "Endocrinology and Reproductive Hormones" };
  if (key.includes("urine") || key.includes("urinal")) return { category: "Laboratory", subcategory: "Urine Analysis" };
  if (key.includes("hemat") || key.includes("blood count") || key.includes("cbc") || key.includes("platelet") || key.includes("ferritin") || key.includes("iron")) return { category: "Laboratory", subcategory: "Hematology" };
  if (key.includes("tumor") || key.includes("ca-125") || key.includes("ca 125") || key.includes("cea") || key.includes("afp") || key.includes("he4")) return { category: "Laboratory", subcategory: "Tumor Markers" };
  if (key.includes("andrology") || key.includes("semen")) return { category: "Laboratory", subcategory: "Andrology" };
  if (key.includes("laboratory") || key.includes("lab") || key.includes("biochem") || key.includes("chemistry") || key.includes("glucose") || key.includes("liver") || key.includes("kidney") || key.includes("electrolyte") || key.includes("vitamin")) return { category: "Laboratory", subcategory: subcategory && !subCategoryIsLegacy(subcategory) ? subcategory : "Clinical Chemistry" };
  return { category: category === "Other" ? "Procedures and Referrals" : category || "Other", subcategory: subcategory || "Uncategorized" };
}

function subCategoryIsLegacy(value) {
  return ["general", "laboratory - general", "radiology/imaging", "prenatal/ob tests"].includes(String(value).toLowerCase());
}

function item(code, name, category, subcategory, modality, sampleType, aliases = []) {`);
