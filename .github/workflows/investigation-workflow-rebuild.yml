          replace('apps/web/app/investigations/page.tsx',
`        <TabButton active={activeTab === "followup"} label={copy.resultFollowUp} onClick={() => { setActiveTab("followup"); void loadFollowUp(requestStatus); }} />`,
`        <TabButton active={activeTab === "followup"} label={copy.resultFollowUp} onClick={() => { setActiveTab("followup"); void loadFollowUp(requestStatus); }} />
        <TabButton active={activeTab === "templates"} label={language === "ar" ? "القوالب" : "Templates"} onClick={() => setActiveTab("templates")} />`);

          replace('apps/web/app/investigations/page.tsx',
`              <ListLibrary copy={copy} myLists={myLists} sharedTemplates={sharedTemplates} onApply={applySet} onArchive={archiveList} onDuplicate={duplicateList} />
            ) : (
              <>`,
`              <ListLibrary copy={copy} myLists={myLists} sharedTemplates={[]} onApply={applySet} onArchive={archiveList} onDuplicate={duplicateList} />
            ) : activeTab === "templates" ? (
