        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit verified rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/investigation-workflow-rebuild.yml
          git add apps/api/src/investigations/dto.ts apps/api/src/investigations/investigations.service.ts apps/api/prisma/seeds/investigation-catalog.js apps/web/app/layout.tsx apps/web/app/investigations/page.tsx apps/web/app/investigations/investigation-station.module.css apps/web/components/clinic/ActiveVisitWorkspace.tsx
          git commit -m "feat(investigations): shorten patient ordering and normalize taxonomy"
          git push origin HEAD:work/doctor-investigation-station-v1
