                </div>
              </div>
            ) : (
              <div className={styles.managementNotice}>
                <strong>{copy.libraryMode}</strong>
                <span>{language === "ar" ? "اختر مريضة من البحث لإنشاء طلب مباشر بدون فتح زيارة." : "Select a patient above to create a direct Doctor order without opening an encounter."}</span>
              </div>
            )}`);

          replace('apps/web/app/investigations/page.tsx',
`            ) : (
              <Link className="button" href="/patients">{copy.openPatientVisit}</Link>
            )}`,
`            ) : null}`);

          replace('apps/web/app/investigations/investigation-station.module.css',
`grid-template-columns:minmax(14rem,16rem) minmax(0,1fr) minmax(18rem,21rem)`,
`grid-template-columns:minmax(13rem,1fr) minmax(34rem,3fr) minmax(22rem,2fr)`);

          replace('apps/web/app/investigations/investigation-station.module.css',
`.categoryPanel,.basketPanel{position:sticky;top:5.4rem;max-height:calc(100vh - 6.3rem);overflow:auto}`,
`.categoryPanel,.basketPanel{position:sticky;top:5.4rem;max-height:calc(100vh - 6.3rem);overflow:auto}.catalogPanel{max-height:calc(100vh - 12rem);overflow:auto}.patientActions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}`);

          replace('apps/web/app/investigations/investigation-station.module.css',
`@media(max-width:1250px)`,
