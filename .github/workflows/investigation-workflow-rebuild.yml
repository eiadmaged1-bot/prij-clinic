name: Investigation Workflow Rebuild

on:
  push:
    branches:
      - work/doctor-investigation-station-v1

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@v4
        with:
          ref: work/doctor-investigation-station-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply clinical workflow rebuild
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value); }
          function replace(path, from, to) {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`Pattern not found in ${path}: ${from.slice(0, 120)}`);
            write(path, source.replace(from, to));
          }

          replace('apps/api/src/investigations/dto.ts',
`  @IsUUID()
  encounterId!: string;`,
`  @IsOptional()
  @IsUUID()
  encounterId?: string;`);

          replace('apps/api/src/investigations/investigations.service.ts',
`    if (!dto.patientId || !dto.encounterId) {
      throw new BadRequestException("Patient and active visit context are required before saving an investigation request.");
    }
    await assertCanReferencePatient(this.prisma, dto.patientId, user);
    await assertCanReferenceEncounter(this.prisma, dto.encounterId, user, {
      patientId: dto.patientId,
      requireDoctorScope: true
    });`,
`    if (!dto.patientId) {
      throw new BadRequestException("A patient is required before saving an investigation request.");
    }
    await assertCanReferencePatient(this.prisma, dto.patientId, user);
    if (dto.encounterId) {
      await assertCanReferenceEncounter(this.prisma, dto.encounterId, user, {
        patientId: dto.patientId,
        requireDoctorScope: true
      });
    } else if (!user.roles.some((role) => role === "Doctor" || role === "Owner")) {
      throw new ForbiddenException("Standalone investigation orders require Doctor or Owner authority.");
    }`);

          replace('apps/api/src/investigations/investigations.service.ts',
`      await (this.prisma as unknown as { investigationOrderDraft: any }).investigationOrderDraft.deleteMany({ where: { encounterId: dto.encounterId, userId: user.id } });`,
`      if (dto.encounterId) {
        await (this.prisma as unknown as { investigationOrderDraft: any }).investigationOrderDraft.deleteMany({ where: { encounterId: dto.encounterId, userId: user.id } });
      }`);

          replace('apps/web/app/layout.tsx',
`import "./globals.css";`,
`import "./globals.css";
import "./investigation-embedded.css";`);

          replace('apps/web/components/clinic/ActiveVisitWorkspace.tsx',
`import { PatientVisitIdentityBar } from "./PatientVisitIdentityBar";`,
`import { PatientVisitIdentityBar } from "./PatientVisitIdentityBar";
import { EncounterInvestigationOrderBuilder } from "@/components/investigations/EncounterInvestigationOrderBuilder";`);

          replace('apps/web/components/clinic/ActiveVisitWorkspace.tsx',
`            {activeModule === "investigations" ? <InvestigationsModule patientId={patientId} visitId={visitId} /> : null}`,
`            {activeModule === "investigations" ? <EncounterInvestigationOrderBuilder patientId={patientId} encounterId={visitId} patientName={String(patient?.name ?? "Patient")} onSaved={() => void loadVisit()} /> : null}`);

          replace('apps/web/components/clinic/ActiveVisitWorkspace.tsx',
`function InvestigationsModule({ patientId, visitId }: { patientId: string; visitId: string }) {
  return <section className="panel compact-panel"><h2>Order investigations</h2><p>Open the encounter-locked ordering workspace for favorites, smart sets, duplicate warnings, responsibilities, and the persistent basket.</p><p className="notice">Applying a set never submits an order. Review and submission remain separate Doctor actions.</p><Link className="button" href={\`/investigations?patientId=\${encodeURIComponent(patientId)}&encounterId=\${encodeURIComponent(visitId)}\`}>Open connected investigation ordering</Link></section>;
}

`, ``);

