                <div className={styles.templateGrid}>
                  {sharedTemplates.filter((set) => set.actionable !== false && set.items.length > 0).map((set) => <TemplateCard key={set.id} set={set} onApply={applySet} />)}
                </div>
                {sharedTemplates.filter((set) => set.actionable === false || set.items.length === 0).length ? (
                  <details className="filter-drawer"><summary className="button secondary compact">{language === "ar" ? "إرشادات غير قابلة للطلب" : "Guidance-only entries"}</summary><div className={styles.listGrid}>{sharedTemplates.filter((set) => set.actionable === false || set.items.length === 0).map((set) => <article className={`panel ${styles.listCard}`} key={set.id}><strong>{set.name}</strong>{set.nameAr ? <span dir="rtl">{set.nameAr}</span> : null}<p className="muted">{set.guidanceText || copy.nonActionable}</p></article>)}</div></details>
                ) : null}
              </section>
            ) : (
              <>`);

          const pagePath = 'apps/web/app/investigations/page.tsx';
          let page = read(pagePath);
          page = page.replace(/\n\s*\{activeTab === "library" && sharedTemplates\.length \? \([\s\S]*?\n\s*\) : null\}\n/, '\n');
          write(pagePath, page);

          replace('apps/web/app/investigations/page.tsx',
`            {hasPatientContext ? (
              <div className={styles.patientContext}>
                <strong>{patient ? patientLabel(patient) : copy.selectedPatient}</strong>
                <span>{patient?.medicalRecordNumber ? \`MRN \${patient.medicalRecordNumber}\` : copy.activeVisit}</span>
              </div>
            ) : (
              <div className={styles.managementNotice}>
                <strong>{copy.libraryMode}</strong>
                <span>{copy.openVisitMessage}</span>
              </div>
            )}`,
`            <PatientPicker
              patients={patient ? [patient] : []}
              selectedPatientId={patientId}
              onSelect={() => undefined}
              onPatientSelect={(nextPatient) => { if (nextPatient) choosePatient(nextPatient); }}
              label={language === "ar" ? "اختيار المريضة" : "Select patient for this order"}
              required={false}
              liveSearch
              storageKey="investigation-station-patient"
            />

            {hasPatientContext ? (
              <div className={styles.patientContext}>
                <strong>{patient ? patientLabel(patient) : copy.selectedPatient}</strong>
                <span>{patient?.medicalRecordNumber ? \`MRN \${patient.medicalRecordNumber}\` : copy.selectedPatient}</span>
                <div className={styles.patientActions}>
                  <Link className="button secondary compact" href={\`/patients/\${encodeURIComponent(patientId)}\`}>{language === "ar" ? "فتح الملف" : "Open patient file"}</Link>
