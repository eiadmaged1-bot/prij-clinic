          replace('apps/web/app/investigations/page.tsx',
`  async function submitOrder(event: FormEvent) {`,
`  function choosePatient(nextPatient: PatientPickerPatient) {
    if (nextPatient.id === patientId) return;
    if (selected.length && patientId && !window.confirm("Change patient and keep the current investigation basket? Cancel to remain on the current patient.")) return;
    setPatient(nextPatient);
    setPatientId(nextPatient.id);
    setEncounterId("");
    setSavedRequestId("");
    setWarningsConfirmed(false);
    void loadPatientRequests(nextPatient.id);
    const params = new URLSearchParams(window.location.search);
    params.set("patientId", nextPatient.id);
    params.delete("encounterId");
    params.delete("visitId");
    window.history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
    setStatus("Patient selected. This will be saved as a standalone Doctor investigation order.");
  }

  function clearPatientContext() {
    if (selected.length && !window.confirm("Clear the patient while keeping the current basket? The basket cannot be submitted until another patient is selected.")) return;
    setPatient(null);
    setPatientId("");
    setEncounterId("");
    setPatientRequests([]);
    setSavedRequestId("");
    setWarningsConfirmed(false);
    window.history.replaceState(null, "", window.location.pathname);
    setStatus("Patient cleared. Catalogue and basket remain available in Library mode.");
  }

  async function submitOrder(event: FormEvent) {`);

          replace('apps/web/app/investigations/page.tsx',
`      patientId,
      encounterId,
      priority,`,
`      patientId,
      ...(encounterId ? { encounterId } : {}),
