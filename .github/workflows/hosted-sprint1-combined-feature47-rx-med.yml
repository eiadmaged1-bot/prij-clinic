name: Hosted Sprint 1 Combined Feature 47 RX Medication

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_COMBINED_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  TARGET_BRANCH: work/sprint1-feature47-rx-med-combined

jobs:
  integrate-and-verify:
    name: Integrate Feature 47, medication cards, and structured Arabic RX
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated combined branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply compact medication cards
        run: node scripts/runner/apply-hosted-medication-cards.mjs

      - name: Verify medication-card contract
        run: node scripts/qa-medication-cards-contract-test.mjs

      - name: Apply structured Arabic prescription package
        run: node scripts/runner/apply-structured-arabic-prescription.mjs

      - name: Verify structured Arabic prescription contract
        run: node scripts/qa-structured-arabic-prescription-contract-test.mjs

      - name: Verify Feature 47 calendar and reproductive history
        run: node scripts/qa-calendar-history-contract-test.mjs

      - name: Pregnancy and EDD regression
        run: node scripts/qa-pregnancy-edd-contract-test.mjs

      - name: Feature 46 refractory complaint regression
        run: node scripts/feature-46-refractory-complaint-test.mjs

      - name: Medication UI clean regression
        run: npm run test:medication-ui-clean

      - name: Capture v0.9.3 medication declutter result
        shell: bash
        run: |
          set +e
          npm run test:v093:medication-ui > /tmp/v093-medication.log 2>&1
          code=$?
          cat /tmp/v093-medication.log
          cp /tmp/v093-medication.log docs/verification/V093_COMBINED_DIAGNOSTIC.log
          printf '%s\n' "$code" > docs/verification/V093_COMBINED_EXIT_CODE.txt
          exit 0

      - name: Preserve v0.9.3 diagnostic
        shell: bash
        run: |
          git config user.name "eiadmaged1-bot"
          git config user.email "eiadmaged1-bot@users.noreply.github.com"
          git add docs/verification/V093_COMBINED_DIAGNOSTIC.log docs/verification/V093_COMBINED_EXIT_CODE.txt
          git diff --cached --quiet && exit 0
          git commit -m "test: capture combined v0.9.3 medication diagnostic"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Enforce v0.9.3 medication declutter regression
        shell: bash
        run: test "$(cat docs/verification/V093_COMBINED_EXIT_CODE.txt)" = "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: git diff --check

      - name: Write combined Sprint 1 verification evidence
        shell: bash
        run: |
          cat > docs/verification/SPRINT1_FEATURE47_RX_MED_COMBINED_VERIFICATION.md <<'EOF'
          # Sprint 1 Feature 47 + RX + Medication Combined Verification

          Status: PASS

          - Runner: GitHub-hosted ubuntu-latest
          - Isolated branch: work/sprint1-feature47-rx-med-combined
          - Feature 46 refractory complaint regression: PASS
          - QA-PREG-001 pregnancy workflow: PASS
          - QA-EDD-001 EDD modes and provenance: PASS
          - Feature 47 QA-CAL-001 compact calendars: PASS
          - Feature 47 QA-HIST-001 reproductive/pregnancy history: PASS
          - QA-MED-001 compact medication cards: PASS
          - QA-RX-001/002 structured Arabic prescription: PASS
          - Medication UI clean regression: PASS
          - v0.9.3 medication declutter regression: PASS
          - Typecheck: PASS
          - Production build: PASS
          - git diff --check: PASS
          - Database migration/seed/reset/delete/truncate: NOT RUN
          - Production data mutation: NONE
          - Secrets printed or exposed: NONE
          EOF

      - name: Commit verified combined package
        shell: bash
        run: |
          git config user.name "eiadmaged1-bot"
          git config user.email "eiadmaged1-bot@users.noreply.github.com"
          git add apps/web/components/clinic/ActiveVisitWorkspace.tsx apps/web/app/globals.css scripts/runner/apply-hosted-medication-cards.mjs scripts/qa-medication-cards-contract-test.mjs scripts/runner/apply-structured-arabic-prescription.mjs scripts/qa-structured-arabic-prescription-contract-test.mjs docs/verification/SPRINT1_FEATURE47_RX_MED_COMBINED_VERIFICATION.md
          git diff --cached --quiet && { echo "No combined package changes to commit"; exit 0; }
          git commit -m "feat: verify combined Feature 47 medication and Arabic RX package [sprint1-combined]"
          git push origin HEAD:${TARGET_BRANCH}
