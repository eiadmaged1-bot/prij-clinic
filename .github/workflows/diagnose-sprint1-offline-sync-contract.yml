name: Diagnose Sprint 1 Offline Sync Contract

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_OFFLINE_SYNC_HEALTH_TRIGGER.md

permissions:
  contents: read

concurrency:
  group: diagnose-sprint1-offline-sync-contract
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 1
          path: controls

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: work/offline-sync-health-v1
          fetch-depth: 1
          path: workspace

      - name: Apply package
        working-directory: workspace
        run: |
          node ../controls/scripts/runner/apply-sprint1-offline-sync-health.mjs "$PWD"
          node ../controls/scripts/runner/repair-sprint1-offline-sync-health.mjs "$PWD"

      - name: Capture focused contract output
        id: diagnose
        working-directory: workspace
        shell: bash
        run: |
          set +e
          node scripts/sprint1-offline-sync-health-test.mjs > offline-sync-contract-diagnostic.log 2>&1
          test_status=$?
          cat offline-sync-contract-diagnostic.log
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: offline-sync-contract-diagnostic
          path: workspace/offline-sync-contract-diagnostic.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve failure conclusion
        if: steps.diagnose.outputs.exit_code != '0'
        run: exit 1
