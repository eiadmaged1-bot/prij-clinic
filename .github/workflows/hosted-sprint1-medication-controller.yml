name: Hosted Sprint 1 Medication Controller

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_CONTROLLER_TRIGGER.md
  push:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_CONTROLLER_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  TARGET_BRANCH: work/hosted-ci-medication-rx-repair

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Sprint 1 application branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply resilient medication-card repair
        run: node scripts/runner/apply-hosted-medication-cards.mjs

      - name: Medication-card contract
        run: node scripts/qa-medication-cards-contract-test.mjs

      - name: Medication UI clean regression
        run: npm run test:medication-ui-clean

      - name: v0.9.3 medication declutter regression
        run: npm run test:v093:medication-ui

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: git diff --check

      - name: Write verification evidence
        shell: bash
        run: |
          cat > docs/verification/QA_MEDICATION_CARDS_HOSTED_VERIFICATION.md <<'EOF'
          # QA Medication Cards Hosted Verification

          Status: PASS

          - Runner: GitHub-hosted ubuntu-latest
          - Isolated branch: work/hosted-ci-medication-rx-repair
          - Compact medication-card contract: PASS
          - Medication UI clean regression: PASS
          - v0.9.3 medication declutter regression: PASS
          - Typecheck: PASS
          - Production build: PASS
          - git diff --check: PASS
          - Database migration/seed/reset/delete/truncate: NOT RUN
          - Production data mutation: NONE
          EOF

      - name: Commit verified implementation and evidence
        shell: bash
        run: |
          git config user.name "eiadmaged1-bot"
          git config user.email "eiadmaged1-bot@users.noreply.github.com"
          git add apps/web/components/clinic/ActiveVisitWorkspace.tsx apps/web/app/globals.css docs/verification/QA_MEDICATION_CARDS_HOSTED_VERIFICATION.md
          git diff --cached --quiet && { echo "No implementation changes to commit"; exit 0; }
          git commit -m "feat: verify compact medication cards [hosted-medication-verified]"
          git push origin HEAD:${TARGET_BRANCH}
