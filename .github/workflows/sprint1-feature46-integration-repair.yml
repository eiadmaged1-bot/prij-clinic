name: Sprint 1 Feature 46 Integration Repair

on:
  workflow_dispatch:
  push:
    branches:
      - docs/200-feature-architecture-and-sprint-a
    paths:
      - .github/workflows/sprint1-feature46-integration-repair.yml

permissions:
  contents: write

concurrency:
  group: sprint1-feature46-integration-repair
  cancel-in-progress: false

jobs:
  integrate-repair-verify:
    name: Integrate, repair, and fully verify
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout protected Sprint 1 branch
        uses: actions/checkout@v4
        with:
          ref: work/sprint1-fix3-protected
          fetch-depth: 0
          clean: true
          path: workspace

      - name: Prepare isolated integration branch
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SECTRA') { throw "Expected SECTRA, got '$env:RUNNER_NAME'." }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows, got '$env:RUNNER_OS'." }
          if (git status --porcelain) { throw 'Protected Sprint 1 checkout is not clean.' }
          git fetch origin test/feature-46-refractory-complaint
          git checkout -B integration/sprint1-fix3-feature46
          codex --version

      - name: Apply verified Feature 46
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git cherry-pick --no-commit 149c22dd7f3d91c82d184d7d4087403feb8506b3
          $applyExit = $LASTEXITCODE
          $conflicts = @(git diff --name-only --diff-filter=U)
          if ($applyExit -ne 0 -and $conflicts.Count -eq 0) {
            throw "Feature 46 cherry-pick failed without resolvable conflicts. Exit $applyExit"
          }
          exit 0

      - name: Resolve integration conflicts safely
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force '.verification-logs' | Out-Null

          function Invoke-CodexRepair([string]$Prompt, [string]$LogName) {
            $Prompt | & codex -a never -s danger-full-access exec --ephemeral 2>&1 | Tee-Object -FilePath ".verification-logs\$LogName.log"
            return $LASTEXITCODE
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $conflicts = @(git diff --name-only --diff-filter=U)
            if ($conflicts.Count -eq 0) { break }

            $conflictList = $conflicts -join "`n- "
            $prompt = @(
              'Resolve every Git conflict in this isolated Prij Clinic integration.',
              '',
              'Conflicted files:',
              "- $conflictList",
              '',
              'Preserve both bodies of work:',
              '1. Sprint 1 Fix 3 clinical-input, medication, and server-side search changes.',
              '2. Feature 46 refractory complaint lifecycle across shared types, DTO validation, persistence, signing idempotency, longitudinal history/provenance, patient overview, encounter UI, styling, and focused tests.',
              '',
              'Rules:',
              '- Resolve semantically; do not choose ours or theirs wholesale when both contain required behavior.',
              '- Do not weaken, remove, bypass, or falsify tests.',
              '- Do not create migrations or touch reference/, local-reference/, datasets, backups, secrets, uploads, or .env files.',
              '- Do not reset, clean, stash, commit, push, or switch branches.',
              '- Remove all conflict markers.',
              '- Keep clinical output doctor-controlled and preserve backward compatibility.'
            ) -join "`n"

            $code = Invoke-CodexRepair $prompt "conflict-repair-$attempt"
            Write-Host "Conflict repair attempt $attempt exit: $code"
          }

          $remaining = @(git diff --name-only --diff-filter=U)
          if ($remaining.Count -gt 0) {
            Write-Host 'Unresolved files:'
            $remaining | ForEach-Object { Write-Host $_ }
            Get-ChildItem '.verification-logs\conflict-repair-*.log' | ForEach-Object {
              Write-Host "===== $($_.Name) ====="
              Get-Content $_.FullName -Tail 120
            }
            throw 'Unresolved integration conflicts remain after three repair attempts.'
          }

          git add --all
          git rev-parse -q --verify CHERRY_PICK_HEAD *> $null
          if ($LASTEXITCODE -eq 0) { git cherry-pick --quit }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            $whitespacePrompt = @(
              'Repair only whitespace errors, malformed conflict resolutions, and syntax damage in the current staged integration.',
              'Preserve all Sprint 1 Fix 3 and Feature 46 behavior.',
              'Do not weaken tests, commit, push, reset, clean, stash, or switch branches.',
              'Finish with git diff --check passing.'
            ) -join "`n"
            Invoke-CodexRepair $whitespacePrompt 'conflict-whitespace-repair' | Out-Null
            git add --all
            git diff --cached --check
            if ($LASTEXITCODE -ne 0) { throw 'Conflict resolution still has diff-check errors.' }
          }

      - name: Install dependencies
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci

      - name: Repair until every required check passes
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force '.verification-logs' | Out-Null

          function Invoke-Check([string]$Name, [string]$Command) {
            $log = ".verification-logs\$Name.log"
            cmd /d /s /c "$Command" 2>&1 | Tee-Object -FilePath $log
            return $LASTEXITCODE
          }

          $passed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Verification attempt $attempt of 5"
            $results = [ordered]@{}
            $results['clinical-workflow'] = Invoke-Check 'clinical-workflow' 'node scripts/clinical-workflow-unification-test.mjs'
            $results['fix3-medication'] = Invoke-Check 'fix3-medication' 'node scripts/recovery-fix3-medication-test.mjs'
            $results['fix3-search'] = Invoke-Check 'fix3-search' 'node scripts/recovery-fix3-search-test.mjs'
            $results['feature46'] = Invoke-Check 'feature46' 'node scripts/feature-46-refractory-complaint-test.mjs'
            $results['typecheck'] = Invoke-Check 'typecheck' 'npm run typecheck'
            $results['build'] = Invoke-Check 'build' 'npm run build'

            $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne 0 })
            if ($failed.Count -eq 0) {
              $passed = $true
              break
            }
            if ($attempt -eq 5) { break }

            $failureSummary = foreach ($entry in $failed) {
              $tail = (Get-Content ".verification-logs\$($entry.Key).log" -Tail 180) -join "`n"
              "### $($entry.Key)`n$tail"
            }

            $prompt = @(
              'Repair this isolated Prij Clinic integration so every required check passes.',
              '',
              'Failed checks and log tails:',
              ($failureSummary -join "`n`n"),
              '',
              'Required checks:',
              '- node scripts/clinical-workflow-unification-test.mjs',
              '- node scripts/recovery-fix3-medication-test.mjs',
              '- node scripts/recovery-fix3-search-test.mjs',
              '- node scripts/feature-46-refractory-complaint-test.mjs',
              '- npm run typecheck',
              '- npm run build',
              '',
              'Rules:',
              '- Diagnose root causes; never weaken, skip, delete, bypass, or falsify tests.',
              '- Preserve Sprint 1 Fix 3 and Feature 46.',
              '- Refractory remains clinically active, longitudinal, non-Resolved, provenance-preserving, and signing-idempotent.',
              '- Preserve medication governance and server-side search behavior.',
              '- No reset, delete, truncate, seed, migration, production data, secrets, PHI, datasets, reference/, or local-reference/.',
              '- Do not commit, push, reset, clean, stash, or switch branches.',
              '- Keep repairs narrowly scoped and backward compatible.'
            ) -join "`n"

            $prompt | & codex -a never -s danger-full-access exec --ephemeral 2>&1 | Tee-Object -FilePath ".verification-logs\repair-attempt-$attempt.log"
            Write-Host "Codex repair attempt $attempt exit: $LASTEXITCODE"
            git diff --check
          }

          if (-not $passed) {
            Get-ChildItem '.verification-logs\*.log' | ForEach-Object {
              Write-Host "===== $($_.Name) ====="
              Get-Content $_.FullName -Tail 160
            }
            throw 'Required checks still fail after five repair attempts.'
          }

      - name: Enforce final safety gates
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(git status --porcelain | ForEach-Object { if ($_.Length -ge 4) { $_.Substring(3) } })
          $forbidden = @($paths | Where-Object {
            $_ -match '(^|[\\/])(\.env|uploads|backups|datasets|secrets?|credentials?)([\\/]|$)' -or
            $_ -match '(^|[\\/])(reference|local-reference)([\\/]|$)' -or
            $_ -match 'prisma[\\/]migrations'
          })
          if ($forbidden.Count -gt 0) { throw "Forbidden paths changed: $($forbidden -join ', ')" }
          if (git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json') { throw 'Conflict markers remain.' }
          git diff --check
          git diff --cached --check

      - name: Write final verification report
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'docs/verification' | Out-Null
          @(
            '# Sprint 1 Fix 3 + Feature 46 Integration Verification',
            '',
            '- Integration branch: `integration/sprint1-fix3-feature46`',
            '- Sprint 1 source: `work/sprint1-fix3-protected`',
            '- Feature 46 commit: `149c22dd7f3d91c82d184d7d4087403feb8506b3`',
            '- Clinical workflow test: PASS',
            '- Fix 3 medication test: PASS',
            '- Fix 3 search test: PASS',
            '- Feature 46 focused test: PASS',
            '- Typecheck: PASS',
            '- Build: PASS',
            '- `git diff --check`: PASS',
            '- Production data used: NO',
            '- Database reset/delete/truncate/seed: NOT RUN',
            '- Main or production branch modified: NO',
            '',
            'Sprint 1 Fix 3 and Feature 46 are integrated, repaired, and verified on an isolated branch.'
          ) | Set-Content 'docs/verification/SPRINT1_FIX3_FEATURE46_INTEGRATION.md'
          Remove-Item '.verification-logs' -Recurse -Force -ErrorAction SilentlyContinue
          git add --all
          git diff --cached --check

      - name: Commit and push verified result
        working-directory: workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if (-not (git diff --cached --name-only)) { throw 'No verified integration changes to commit.' }
          git commit -m 'Integrate Sprint 1 Fix 3 with verified Feature 46'
          git push origin HEAD:integration/sprint1-fix3-feature46
          if (git status --porcelain) { throw 'Workspace is not clean after push.' }
