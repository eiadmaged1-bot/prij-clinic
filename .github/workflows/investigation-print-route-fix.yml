name: Investigation Print Route Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'work/doctor-investigation-station-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/doctor-investigation-station-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix mode-specific print route
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/app/investigations/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'const [savedRequestId, setSavedRequestId] = useState("");\n  const [requestStatus, setRequestStatus] = useState("");',
            'const [savedRequestId, setSavedRequestId] = useState("");\n  const [savedPrintPath, setSavedPrintPath] = useState("");\n  const [requestStatus, setRequestStatus] = useState("");'
          );
          source = source.replaceAll('setSavedRequestId("");\n    setWarningsConfirmed(false);', 'setSavedRequestId("");\n    setSavedPrintPath("");\n    setWarningsConfirmed(false);');
          source = source.replace(
            'setSavedRequestId(saved.id);\n    clearBasket();',
            'setSavedRequestId(saved.id);\n    setSavedPrintPath(hasEncounter ? `/clinical-requests/${encodeURIComponent(saved.id)}/print` : `/investigations/orders/${encodeURIComponent(saved.id)}/print`);\n    clearBasket();'
          );
          source = source.replace(
            'onClick={() => window.open(`/clinical-requests/${encodeURIComponent(savedRequestId)}/print`, "_blank", "noopener,noreferrer")}',
            'onClick={() => savedPrintPath && window.open(savedPrintPath, "_blank", "noopener,noreferrer")}'
          );
          source = source.replace(
            'onClick={() => setSavedRequestId("")}>{t.newOrder}</button>',
            'onClick={() => { setSavedRequestId(""); setSavedPrintPath(""); }}>{t.newOrder}</button>'
          );
          if (!source.includes('savedPrintPath')) throw new Error('Mode-specific print path was not added');
          fs.writeFileSync(path, source);
          NODE

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build

      - name: Commit verified print-route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/investigation-print-route-fix.yml
          git add apps/web/app/investigations/page.tsx
          git commit -m "fix(investigations): use correct print route for each order mode"
          git push origin HEAD:work/doctor-investigation-station-v1
