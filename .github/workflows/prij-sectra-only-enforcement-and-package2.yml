name: Prij SECTRA-Only Enforcement and Package 2 Verify

on:
  workflow_dispatch:
  push:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - .github/workflows/prij-sectra-only-enforcement-and-package2.yml

permissions:
  contents: write

concurrency:
  group: prij-sectra-only-enforcement-package2
  cancel-in-progress: false

jobs:
  enforce-and-verify:
    name: Enforce SECTRA-only workflows and verify Package 2
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Prepare isolated SECTRA workspaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SECTRA') { throw "Expected SECTRA, got '$env:RUNNER_NAME'." }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows, got '$env:RUNNER_OS'." }
          foreach ($name in @('sectra-policy-workspace', 'sectra-package2-workspace', 'sectra-package2-diagnostics')) {
            $target = Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'sectra-package2-diagnostics') | Out-Null

      - name: Checkout workflow controls branch
        uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 0
          clean: false
          path: sectra-policy-workspace

      - name: Quarantine every GitHub-hosted workflow
        working-directory: sectra-policy-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workflowRoot = Join-Path (Get-Location) '.github\workflows'
          $archiveRoot = Join-Path (Get-Location) 'docs\verification\quarantined-hosted-workflows'
          New-Item -ItemType Directory -Force $archiveRoot | Out-Null

          $hostedPattern = '(?im)^\s*(?!#).*\b(?:ubuntu|windows|macos)-(?:latest|[0-9][A-Za-z0-9_.-]*)\b'
          $offenders = New-Object System.Collections.Generic.List[string]

          foreach ($file in Get-ChildItem -LiteralPath $workflowRoot -File | Where-Object { $_.Extension -in @('.yml', '.yaml') }) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            if ($text -notmatch $hostedPattern) { continue }

            $offenders.Add($file.Name)
            $archivePath = Join-Path $archiveRoot ($file.Name + '.txt')
            [System.IO.File]::WriteAllText($archivePath, $text, (New-Object System.Text.UTF8Encoding($false)))

            $safeName = $file.BaseName.Replace("'", '')
            $stub = @(
              "name: Quarantined hosted workflow - $safeName",
              '',
              'on:',
              '  workflow_dispatch:',
              '',
              'permissions:',
              '  contents: read',
              '',
              'jobs:',
              '  quarantined:',
              '    runs-on: [self-hosted, Windows, X64]',
              '    steps:',
              '      - name: Confirm SECTRA-only quarantine',
              '        shell: powershell',
              '        run: |',
              "          if (`$env:RUNNER_NAME -ne 'SECTRA') { throw \"Expected SECTRA, got '`$env:RUNNER_NAME'.\" }",
              "          Write-Host 'This former GitHub-hosted workflow is quarantined. Restore it only with SECTRA runner labels.'"
            )
            [System.IO.File]::WriteAllLines($file.FullName, $stub, (New-Object System.Text.UTF8Encoding($false)))
          }

          $remaining = New-Object System.Collections.Generic.List[string]
          foreach ($file in Get-ChildItem -LiteralPath $workflowRoot -File | Where-Object { $_.Extension -in @('.yml', '.yaml') }) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            if ($text -match $hostedPattern) { $remaining.Add($file.Name) }
          }
          if ($remaining.Count -gt 0) { throw "Hosted runner references remain: $($remaining -join ', ')" }

          $report = @(
            '# SECTRA-Only GitHub Actions Enforcement',
            '',
            "- Enforcement run: `$env:GITHUB_RUN_ID`",
            '- Required runner: `SECTRA`',
            '- Required labels: `[self-hosted, Windows, X64]`',
            "- Hosted workflows quarantined: `$($offenders.Count)`",
            '- GitHub-hosted Actions minutes permitted: `NO`',
            '- Hosted automatic triggers retained: `NO`',
            '- Original workflow definitions archived: `YES`',
            '',
            '## Quarantined files',
            ''
          )
          if ($offenders.Count -eq 0) {
            $report += '- None found.'
          } else {
            foreach ($name in $offenders) { $report += "- `$name`" }
          }
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'docs\verification\SECTRA_ONLY_ACTIONS_ENFORCEMENT.md'), $report, (New-Object System.Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.github/workflows' 'docs/verification/quarantined-hosted-workflows' 'docs/verification/SECTRA_ONLY_ACTIONS_ENFORCEMENT.md'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'SECTRA-only enforcement changes failed diff-check.' }
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Enforce SECTRA-only GitHub Actions'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit SECTRA-only enforcement.' }
            git push origin HEAD:security/rbac-scope-enforcement
            if ($LASTEXITCODE -ne 0) { throw 'Could not push SECTRA-only enforcement.' }
          }

      - name: Checkout QA repair branch
        uses: actions/checkout@v4
        with:
          ref: work/sprint1-qa-repair-batch
          fetch-depth: 0
          clean: false
          path: sectra-package2-workspace

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sectra-package2-workspace/package-lock.json

      - name: Load local development configuration safely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $envPath = 'C:\Newfolder\prij-clinic\.env'
          if (-not (Test-Path -LiteralPath $envPath)) { throw "Missing local environment file: $envPath" }
          $allowed = @('DATABASE_URL', 'JWT_SECRET', 'JWT_EXPIRES_IN', 'AI_FEATURES_ENABLED', 'AI_PROVIDER')
          $databaseFound = $false
          foreach ($line in Get-Content -LiteralPath $envPath) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#') -or -not $trimmed.Contains('=')) { continue }
            $parts = $trimmed.Split('=', 2)
            $key = $parts[0].Trim()
            if ($allowed -notcontains $key) { continue }
            $value = $parts[1].Trim().Trim('"').Trim("'")
            if ($key -eq 'DATABASE_URL' -and $value) { $databaseFound = $true }
            "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (-not $databaseFound) { throw 'DATABASE_URL was not loaded.' }
          Write-Host 'Local environment loaded without printing secret values.'

      - name: Install and prepare Package 2 prerequisites
        working-directory: sectra-package2-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run prisma:generate
          if ($LASTEXITCODE -ne 0) { throw 'Prisma Client generation failed.' }

          $referenceSource = 'C:\Newfolder\prij-clinic\local-reference\egyptian-drugs'
          $referenceTarget = 'local-reference\egyptian-drugs'
          $referenceFile = Join-Path $referenceSource 'egyptian-drugs.csv'
          if (-not (Test-Path -LiteralPath $referenceFile)) { throw "Missing local medication reference: $referenceFile" }
          New-Item -ItemType Directory -Force $referenceTarget | Out-Null
          Copy-Item -Path (Join-Path $referenceSource '*') -Destination $referenceTarget -Recurse -Force
          npm run build --workspace @prij-clinic/api
          if ($LASTEXITCODE -ne 0) { throw 'API prebuild for search verification failed.' }

      - name: Run all eight mandatory Package 2 checks
        working-directory: sectra-package2-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'sectra-package2-diagnostics'
          $checks = [ordered]@{
            'qa-calendar-history' = 'node scripts/qa-calendar-history-contract-test.mjs'
            'qa-pregnancy-edd' = 'node scripts/qa-pregnancy-edd-contract-test.mjs'
            'feature46' = 'node scripts/feature-46-refractory-complaint-test.mjs'
            'clinical-workflow' = 'node scripts/clinical-workflow-unification-test.mjs'
            'fix3-medication' = 'node scripts/recovery-fix3-medication-test.mjs'
            'fix3-search' = 'node scripts/recovery-fix3-search-test.mjs'
            'typecheck' = 'npm run typecheck'
            'build' = 'npm run build'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            Write-Host "===== $($entry.Key) ====="
            $stdout = Join-Path $diag "$($entry.Key).stdout.log"
            $stderr = Join-Path $diag "$($entry.Key).stderr.log"
            $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d', '/s', '/c', $entry.Value) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | ForEach-Object { Write-Host $_ } }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | ForEach-Object { Write-Host $_ } }
            if ($process.ExitCode -ne 0) { throw "Mandatory check failed: $($entry.Key), exit $($process.ExitCode)." }
          }

      - name: Record verified Package 2 evidence
        working-directory: sectra-package2-workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'docs\verification' | Out-Null
          $resultLines = @(
            '# QA Compact Calendar and History Verification',
            '',
            '- Tickets: `QA-CAL-001`, `QA-HIST-001`',
            "- Verification source: SECTRA run `$env:GITHUB_RUN_ID`",
            '- Compact calendar/History contract: PASS',
            '- Pregnancy/EDD regression: PASS',
            '- Feature 46 regression: PASS',
            '- Clinical workflow regression: PASS',
            '- Medication regression: PASS',
            '- Search regression: PASS',
            '- Prisma Client generation: PASS',
            '- Typecheck: PASS',
            '- Production build: PASS',
            '- Calendar desktop maximum width: 760 px',
            '- Calendar desktop/mobile day-cell minimums: 38 px / 34 px',
            '- Visible events per day: 2 with overflow count',
            '- Explicit Previous/Next controls: PASS',
            '- Pregnancy and menopause History filters: PASS',
            '- EDD provenance and correction History: PASS',
            '- Source/provenance details: COLLAPSIBLE',
            '- Migration/seed/reset/delete/truncate: NOT RUN',
            '- Production data modified: NO'
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'docs\verification\QA_CALENDAR_HISTORY_RESULT.md'), $resultLines, (New-Object System.Text.UTF8Encoding($false)))

          $batchLines = @(
            '# Sprint 1 QA Repair Batch',
            '',
            'Baseline: `integration/sprint1-fix3-feature46`',
            '',
            'Status: ACTIVE — Packages 1 and 2 verified on SECTRA; Packages 3 and 4 pending.',
            '',
            '## Verified packages',
            '',
            '- `QA-PREG-001`: VERIFIED',
            '- `QA-EDD-001`: VERIFIED',
            '- `QA-CAL-001`: VERIFIED',
            '- `QA-HIST-001`: VERIFIED',
            '',
            '## Remaining packages',
            '',
            '- `QA-MED-001`: compact medication-result cards.',
            '- `QA-RX-001` and `QA-RX-002`: structured Arabic prescription quantity, timing, and duration.'
          )
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) 'docs\verification\SPRINT1_QA_REPAIR_BATCH.md'), $batchLines, (New-Object System.Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/verification/QA_CALENDAR_HISTORY_RESULT.md' 'docs/verification/SPRINT1_QA_REPAIR_BATCH.md'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Package 2 verification documents failed diff-check.' }
          git commit -m 'Verify compact calendars and History cleanup on SECTRA'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit Package 2 verification.' }
          git push origin HEAD:work/sprint1-qa-repair-batch
          if ($LASTEXITCODE -ne 0) { throw 'Could not push Package 2 verification.' }

      - name: Upload Package 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectra-package2-${{ github.run_id }}
          path: sectra-package2-diagnostics
          if-no-files-found: ignore
          retention-days: 7
