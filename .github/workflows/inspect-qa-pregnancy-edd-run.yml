name: Inspect QA Pregnancy EDD Run

on:
  workflow_dispatch:
  push:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - .github/workflows/inspect-qa-pregnancy-edd-run.yml

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/rbac-scope-enforcement
          fetch-depth: 0

      - name: Record latest target run and compiler annotations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/prij-sprint1-qa-pregnancy-edd.yml/runs?per_page=10")"
          count="$(jq '.workflow_runs | length' <<<"$response")"
          if [[ "$count" -lt 1 ]]; then
            echo "No target workflow run found." >&2
            exit 1
          fi
          run_id="$(jq -r '.workflow_runs[0].id' <<<"$response")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha' <<<"$response")"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" > /tmp/run-view.txt 2>&1 || true
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" > /tmp/check-runs.json 2>/tmp/check-runs-error.txt || true

          {
            jq -r '.workflow_runs[0] | [
              "# Latest QA Pregnancy and EDD Run Status",
              "",
              ("- Run ID: `" + (.id|tostring) + "`"),
              ("- Status: `" + .status + "`"),
              ("- Conclusion: `" + (.conclusion // "pending") + "`"),
              ("- Event: `" + .event + "`"),
              ("- Head SHA: `" + .head_sha + "`"),
              ("- Created: `" + .created_at + "`"),
              ("- Updated: `" + .updated_at + "`"),
              ("- URL: " + .html_url)
            ] | .[]' <<<"$response"
            echo
            echo '## gh run view'
            echo '```text'
            cat /tmp/run-view.txt
            echo '```'
            echo
            echo '## Check runs'
            echo '```text'
            if [[ -s /tmp/check-runs.json ]]; then
              jq -r '.check_runs[]? | [
                ("name=" + .name),
                ("status=" + .status),
                ("conclusion=" + (.conclusion // "pending")),
                ("title=" + (.output.title // "")),
                ("summary=" + (.output.summary // "")),
                ("text=" + (.output.text // ""))
              ] | join("\n") + "\n---"' /tmp/check-runs.json
            fi
            if [[ -s /tmp/check-runs-error.txt ]]; then cat /tmp/check-runs-error.txt; fi
            echo '```'
          } > docs/verification/LATEST_QA_PREGNANCY_EDD_RUN_STATUS.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/LATEST_QA_PREGNANCY_EDD_RUN_STATUS.md
          if git diff --cached --quiet; then
            echo 'Status report unchanged.'
            exit 0
          fi
          git commit -m 'ci: record pregnancy EDD compiler annotations'
          git push origin HEAD:security/rbac-scope-enforcement
