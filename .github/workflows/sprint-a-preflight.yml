name: Sprint A Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - docs/200-feature-architecture-and-sprint-a
    paths:
      - docs/PRIJ_200_FEATURES_ARCHITECTURE_TRIAGE.md
      - docs/PRIJ_NEXT_SPRINT_CODEX_PROMPT.md
      - .github/workflows/sprint-a-preflight.yml

permissions:
  contents: read

concurrency:
  group: sprint-a-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Sprint A package on SECTRA
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Arch: $env:RUNNER_ARCH"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"

          if ($env:RUNNER_NAME -ne 'SECTRA') {
            throw "Expected runner SECTRA, got '$env:RUNNER_NAME'."
          }

          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Expected Windows runner, got '$env:RUNNER_OS'."
          }

      - name: Validate sprint documents
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $triage = 'docs/PRIJ_200_FEATURES_ARCHITECTURE_TRIAGE.md'
          $prompt = 'docs/PRIJ_NEXT_SPRINT_CODEX_PROMPT.md'

          if (-not (Test-Path $triage)) {
            throw "Missing $triage"
          }

          if (-not (Test-Path $prompt)) {
            throw "Missing $prompt"
          }

          $triageText = Get-Content $triage -Raw
          $promptText = Get-Content $prompt -Raw

          if ($triageText -notmatch 'Sprint A') {
            throw 'Architecture triage does not contain Sprint A.'
          }

          if ($promptText -notmatch 'Do not commit, push, or tag') {
            throw 'Sprint prompt is missing the no-commit safety gate.'
          }

          if ($promptText -notmatch 'PARTIAL — NOT COMPLETE') {
            throw 'Sprint prompt is missing the failure reporting rule.'
          }

          Write-Host "Triage bytes: $((Get-Item $triage).Length)"
          Write-Host "Prompt bytes: $((Get-Item $prompt).Length)"

      - name: Repository read-only checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          git status --short
          git diff --check
          git grep -n '<<<<<<<\|=======\|>>>>>>>' -- . ':!package-lock.json' 2>$null

          if ($LASTEXITCODE -eq 0) {
            throw 'Conflict markers found.'
          }

          if (Test-Path 'package.json') {
            node --version
            npm --version
            node -e "const p=require('./package.json'); console.log('Package:', p.name || 'unnamed'); console.log('Scripts:', Object.keys(p.scripts || {}).length)"
          }

      - name: Confirm safe preflight completion
        shell: powershell
        run: |
          Write-Host 'SPRINT A PREFLIGHT PASSED'
          Write-Host 'No database command was run.'
          Write-Host 'No application source file was changed.'
          Write-Host 'No commit, push, or tag was created by this job.'
