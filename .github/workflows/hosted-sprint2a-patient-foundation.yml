name: Hosted Sprint 2A Patient Foundation

on:
  pull_request:
    branches:
      - work/sprint1-qa-repair-batch
    paths:
      - docs/verification/HOSTED_SPRINT2A_PATIENT_FOUNDATION_TRIGGER.md
      - .github/workflows/hosted-sprint2a-patient-foundation.yml
      - scripts/runner/apply-sprint2a-patient-foundation.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosted-sprint2a-patient-foundation-v1
  cancel-in-progress: false

jobs:
  implement-verify:
    name: Repair patient creation and clinical context persistence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Sprint 2A branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply patient foundation repair
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/runner/apply-sprint2a-patient-foundation.mjs
          node scripts/runner/apply-sprint2a-patient-foundation.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify Sprint 2A patient foundation
        run: node scripts/sprint2a-patient-foundation-test.mjs

      - name: Verify patient safety and queue regressions
        run: |
          node scripts/sprint1-patient-safety-core-test.mjs
          node scripts/sprint1-reception-queue-core-test.mjs
          node scripts/v1444-reception-shell-test.mjs
          node scripts/v148-reception-patient-queue-test.mjs
          node scripts/v149-patient-search-queue-recovery-test.mjs

      - name: Verify existing clinical feature regressions
        run: |
          node scripts/feature-46-refractory-complaint-test.mjs
          node scripts/qa-calendar-history-contract-test.mjs
          node scripts/feature-48-compact-medication-cards-test.mjs
          node scripts/feature-49-structured-arabic-prescription-test.mjs
          npm run test:medication-ui-clean
          npm run test:v093:medication-ui

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify exact application scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//')"
          printf '%s\n' "$changed"
          unsafe="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/hosted-sprint2a-patient-foundation\.yml|scripts/runner/apply-sprint2a-patient-foundation\.mjs|docs/verification/HOSTED_SPRINT2A_PATIENT_FOUNDATION_TRIGGER\.md|apps/web/app/patients/new/page\.tsx|apps/web/lib/patient-labels\.ts|apps/api/src/patients/services/patient-lookup\.service\.ts|packages/shared/src/index\.ts|apps/web/app/patients/\[id\]/patient-components\.tsx|apps/web/app/patients/\[id\]/page\.tsx|apps/web/components/patients/PatientSmartIdentityBar\.tsx|scripts/sprint2a-patient-foundation-test\.mjs)$' || true)"
          if [[ -n "$unsafe" ]]; then
            echo 'Out-of-scope Sprint 2A changes:' >&2
            printf '%s\n' "$unsafe" >&2
            exit 1
          fi

      - name: Write verification evidence
        shell: bash
        run: |
          cat > docs/verification/SPRINT2A_PATIENT_FOUNDATION_RESULT.md <<'EOF'
          # Sprint 2A Patient Foundation and Clinical Context Repair

          Status: PASS

          ## Patient creation contract

          - The doctor quick-create form starts with a real `OBSTETRIC` value rather than an invisible legacy `WOMEN_HEALTH` state.
          - Creation choices are Pregnancy / Obstetric, Gynecology, Fertility, and Undetermined.
          - High-risk obstetric and postpartum are not selectable patient-creation types.
          - Doctor quick creation uses the governed create-and-start-visit endpoint.
          - The selected context is sent without a silent fallback.
          - Birth year is validated before submission.
          - API validation arrays, duplicate-review conflicts, permission failures, and MRN conflicts surface specific messages.

          ## Persistence and identity

          - `yearOfBirth` is returned in the patient workspace summary.
          - Age falls back safely to `yearOfBirth` when exact date of birth is not yet available.
          - Patient page and identity header preserve the returned birth year after refresh.
          - Selected patient context remains available to the clinical workspace.

          ## Verification

          - Sprint 2A focused contract: PASS
          - Patient Safety Core regression: PASS
          - Reception and Queue Core regressions: PASS
          - Features 46–49 regressions: PASS
          - Medication regressions: PASS
          - Typecheck: PASS
          - Production build: PASS
          - Exact scope and git diff check: PASS

          ## Data safety

          - Database migration: NOT RUN
          - Database seed: NOT RUN
          - Database reset/delete/truncate: NOT RUN
          - Existing patient records changed: NONE
          - Production data mutation: NONE
          - Secrets changed or exposed: NONE
          EOF

      - name: Commit verified Sprint 2A package
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/hosted-sprint2a-patient-foundation.yml \
            scripts/runner/apply-sprint2a-patient-foundation.mjs \
            docs/verification/HOSTED_SPRINT2A_PATIENT_FOUNDATION_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/app/patients/new/page.tsx \
            apps/web/lib/patient-labels.ts \
            apps/api/src/patients/services/patient-lookup.service.ts \
            packages/shared/src/index.ts \
            'apps/web/app/patients/[id]/patient-components.tsx' \
            'apps/web/app/patients/[id]/page.tsx' \
            apps/web/components/patients/PatientSmartIdentityBar.tsx \
            scripts/sprint2a-patient-foundation-test.mjs \
            docs/verification/SPRINT2A_PATIENT_FOUNDATION_RESULT.md
          git add -u \
            .github/workflows/hosted-sprint2a-patient-foundation.yml \
            scripts/runner/apply-sprint2a-patient-foundation.mjs \
            docs/verification/HOSTED_SPRINT2A_PATIENT_FOUNDATION_TRIGGER.md
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          unsafe="$(printf '%s\n' "$staged" | grep -Ev '^(apps/web/app/patients/new/page\.tsx|apps/web/lib/patient-labels\.ts|apps/api/src/patients/services/patient-lookup\.service\.ts|packages/shared/src/index\.ts|apps/web/app/patients/\[id\]/patient-components\.tsx|apps/web/app/patients/\[id\]/page\.tsx|apps/web/components/patients/PatientSmartIdentityBar\.tsx|scripts/sprint2a-patient-foundation-test\.mjs|docs/verification/SPRINT2A_PATIENT_FOUNDATION_RESULT\.md|\.github/workflows/hosted-sprint2a-patient-foundation\.yml|scripts/runner/apply-sprint2a-patient-foundation\.mjs|docs/verification/HOSTED_SPRINT2A_PATIENT_FOUNDATION_TRIGGER\.md)$' || true)"
          if [[ -n "$unsafe" ]]; then
            echo 'Unsafe staged files:' >&2
            printf '%s\n' "$unsafe" >&2
            exit 1
          fi
          git commit -m 'Repair patient creation and clinical context persistence'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
