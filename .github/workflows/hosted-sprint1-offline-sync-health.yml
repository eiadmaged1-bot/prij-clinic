name: Hosted Sprint 1 Offline Sync Health

on:
  pull_request:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - docs/verification/HOSTED_SPRINT1_OFFLINE_SYNC_HEALTH_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: work/offline-sync-health-v1
  CONTROLS_BRANCH: security/rbac-scope-enforcement

concurrency:
  group: hosted-sprint1-offline-sync-health-v1
  cancel-in-progress: false

jobs:
  implement-verify:
    name: Implement and verify offline autosave and sync recovery
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout deterministic controls
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLS_BRANCH }}
          fetch-depth: 1
          path: controls

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: workspace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Apply offline autosave and sync-health package
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          node --check ../controls/scripts/runner/apply-sprint1-offline-sync-health.mjs
          node --check ../controls/scripts/runner/repair-sprint1-offline-sync-health.mjs
          node ../controls/scripts/runner/apply-sprint1-offline-sync-health.mjs "$PWD"
          node ../controls/scripts/runner/repair-sprint1-offline-sync-health.mjs "$PWD"
          git diff --check

      - name: Install dependencies
        working-directory: workspace
        run: npm ci

      - name: Generate Prisma client
        working-directory: workspace
        run: npm run prisma:generate

      - name: Verify offline autosave and sync recovery
        working-directory: workspace
        run: node scripts/sprint1-offline-sync-health-test.mjs

      - name: Verify patient safety core
        working-directory: workspace
        run: node scripts/sprint1-patient-safety-core-test.mjs

      - name: Verify receptionist and queue core
        working-directory: workspace
        run: |
          node scripts/sprint1-reception-queue-core-test.mjs
          node scripts/v1444-reception-shell-test.mjs
          node scripts/v148-reception-patient-queue-test.mjs
          node scripts/v149-patient-search-queue-recovery-test.mjs

      - name: Verify Features 46 through 49
        working-directory: workspace
        run: |
          node scripts/feature-46-refractory-complaint-test.mjs
          node scripts/qa-calendar-history-contract-test.mjs
          node scripts/feature-48-compact-medication-cards-test.mjs
          node scripts/feature-49-structured-arabic-prescription-test.mjs

      - name: Verify medication regressions
        working-directory: workspace
        run: |
          npm run test:medication-ui-clean
          npm run test:v093:medication-ui

      - name: Typecheck
        working-directory: workspace
        run: npm run typecheck

      - name: Production build
        working-directory: workspace
        run: npm run build

      - name: Verify exact application scope
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//')"
          printf '%s\n' "$changed"
          unsafe="$(printf '%s\n' "$changed" | grep -Ev '^(apps/web/lib/offline-sync\.ts|apps/web/components/system/OfflineSyncHealth\.tsx|apps/web/components/clinic/ActiveVisitWorkspace\.tsx|apps/web/app/mvp-page\.tsx|apps/web/app/globals\.css|scripts/sprint1-offline-sync-health-test\.mjs)$' || true)"
          if [[ -n "$unsafe" ]]; then
            echo 'Out-of-scope application changes:' >&2
            printf '%s\n' "$unsafe" >&2
            exit 1
          fi

      - name: Write verification evidence
        working-directory: workspace
        shell: bash
        run: |
          cat > docs/verification/SPRINT1_OFFLINE_SYNC_HEALTH_RESULT.md <<'EOF'
          # Sprint 1 Offline Autosave and Sync Health

          Status: PASS

          ## Offline draft safety

          - Unsigned doctor-visit changes are saved locally after a short debounce.
          - Queue records are locked to the exact patient and encounter.
          - Authentication tokens, cookies, passwords, and secrets are excluded from persisted queue payloads.
          - One queued record replaces older queued changes for the same patient and encounter.
          - A signed visit remains read only.

          ## Synchronization

          - Online edits autosync to the existing optimistic-concurrency visit endpoint.
          - Offline edits remain pending and retry when connectivity returns.
          - Failed items remain visible and retryable.
          - Successful items are removed from the local queue and the server visit is reloaded.
          - Concurrent sends are protected by an in-tab synchronization lock.

          ## Conflict recovery

          - `VISIT_DRAFT_STALE`, `ENCOUNTER_SIGN_CONFLICT`, and HTTP 409 responses become explicit conflicts.
          - Conflict items are preserved locally.
          - Conflict items never overwrite the server automatically.
          - The user can discard the local copy and reload the server version.
          - Visit signing and printing are blocked until the draft is fully synchronized.

          ## Health visibility

          - The authenticated shell displays Online/Offline, pending, failed, and conflict state.
          - The global indicator exposes counts only; it does not expose patient identity or clinical text.
          - Receptionist and clinical shells both receive the compact health indicator.
          - Mobile layout keeps the indicator and conflict actions usable.

          ## Verification

          - Offline sync contract: PASS
          - Patient Safety Core regression: PASS
          - Receptionist and Queue Core regressions: PASS
          - Features 46–49 regressions: PASS
          - Medication regressions: PASS
          - Typecheck: PASS
          - Production build: PASS
          - Exact scope and git diff check: PASS

          ## Data safety

          - Database migration: NOT RUN
          - Database seed: NOT RUN
          - Database reset/delete/truncate: NOT RUN
          - Production data mutation: NONE
          - Secrets changed or exposed: NONE
          EOF

      - name: Commit verified offline sync package
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/lib/offline-sync.ts \
            apps/web/components/system/OfflineSyncHealth.tsx \
            apps/web/components/clinic/ActiveVisitWorkspace.tsx \
            apps/web/app/mvp-page.tsx \
            apps/web/app/globals.css \
            scripts/sprint1-offline-sync-health-test.mjs \
            docs/verification/SPRINT1_OFFLINE_SYNC_HEALTH_RESULT.md
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          unsafe="$(printf '%s\n' "$staged" | grep -Ev '^(apps/web/lib/offline-sync\.ts|apps/web/components/system/OfflineSyncHealth\.tsx|apps/web/components/clinic/ActiveVisitWorkspace\.tsx|apps/web/app/mvp-page\.tsx|apps/web/app/globals\.css|scripts/sprint1-offline-sync-health-test\.mjs|docs/verification/SPRINT1_OFFLINE_SYNC_HEALTH_RESULT\.md)$' || true)"
          if [[ -n "$unsafe" ]]; then
            echo 'Unsafe staged files:' >&2
            printf '%s\n' "$unsafe" >&2
            exit 1
          fi
          git commit -m 'Complete Sprint 1 offline autosave and sync health'
          git push origin HEAD:${TARGET_BRANCH}
