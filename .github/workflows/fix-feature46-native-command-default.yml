name: Fix Feature 46 Native Command Handling

on:
  workflow_dispatch:
  push:
    branches:
      - security/rbac-scope-enforcement
    paths:
      - .github/workflows/fix-feature46-native-command-default.yml

permissions:
  contents: write

jobs:
  repair:
    name: Fix Feature 46 Codex stderr handling
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Verify SECTRA runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SECTRA') { throw "Expected SECTRA, got '$env:RUNNER_NAME'." }
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows, got '$env:RUNNER_OS'." }

      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: docs/200-feature-architecture-and-sprint-a
          fetch-depth: 0
          clean: true

      - name: Repair PowerShell native command handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/workflows/sprint1-feature46-integration-repair.yml'
          $text = Get-Content -LiteralPath $path -Raw

          $oldFunction = @'
          function Invoke-CodexRepair([string]$Prompt, [string]$LogName) {
            $log = Join-Path $env:PRIJ_VERIFY_LOG_DIR "$LogName.log"
            $output = $Prompt | & codex -a never -s workspace-write exec --ephemeral 2>&1
            $code = $LASTEXITCODE
            $output | Tee-Object -FilePath $log | ForEach-Object { Write-Host $_ }
            return [int]$code
          }
'@

          $newFunction = @'
          function Invoke-CodexRepair([string]$Prompt, [string]$LogName) {
            $log = Join-Path $env:PRIJ_VERIFY_LOG_DIR "$LogName.log"
            $previousErrorPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $output = $Prompt | & codex -a never -s workspace-write exec --ephemeral 2>&1
              $code = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorPreference
            }
            $output | Tee-Object -FilePath $log | ForEach-Object { Write-Host $_ }
            return [int]$code
          }
'@

          if (-not $text.Contains($oldFunction)) {
            throw 'Could not find the current Invoke-CodexRepair block.'
          }
          $text = $text.Replace($oldFunction, $newFunction)

          $oldVerificationCall = @'
            $repairLog = Join-Path $env:PRIJ_VERIFY_LOG_DIR "repair-attempt-$attempt.log"
            $repairOutput = $prompt | & codex -a never -s workspace-write exec --ephemeral 2>&1
            $repairCode = $LASTEXITCODE
            $repairOutput | Tee-Object -FilePath $repairLog | ForEach-Object { Write-Host $_ }
            Write-Host "Codex repair attempt $attempt exit: $repairCode"
'@

          $newVerificationCall = @'
            $repairLog = Join-Path $env:PRIJ_VERIFY_LOG_DIR "repair-attempt-$attempt.log"
            $previousErrorPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $repairOutput = $prompt | & codex -a never -s workspace-write exec --ephemeral 2>&1
              $repairCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorPreference
            }
            $repairOutput | Tee-Object -FilePath $repairLog | ForEach-Object { Write-Host $_ }
            Write-Host "Codex repair attempt $attempt exit: $repairCode"
'@

          if (-not $text.Contains($oldVerificationCall)) {
            throw 'Could not find the current verification Codex block.'
          }
          $text = $text.Replace($oldVerificationCall, $newVerificationCall)
          $text = $text.Replace('/.runner-logs/', '/runner-logs/')

          if ($text.Contains('/.runner-logs/')) { throw 'Hidden diagnostics path still remains.' }
          if (([regex]::Matches($text, "\$ErrorActionPreference = 'Continue'")).Count -lt 3) {
            throw 'Expected guarded Codex native-command handling was not installed.'
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8NoBom)

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Workflow repair introduced diff-check errors.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          if (-not (git diff --cached --name-only)) { throw 'Workflow repair made no changes.' }
          git commit -m 'ci: tolerate Codex stderr in Feature 46 repair'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit Codex stderr repair.' }
          git push origin HEAD:docs/200-feature-architecture-and-sprint-a
          if ($LASTEXITCODE -ne 0) { throw 'Could not push Codex stderr repair.' }
